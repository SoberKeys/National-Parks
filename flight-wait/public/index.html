<title>Leaveby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F2F4F7;
    --surface: #FFFFFF;
    --surface-2: #F7F8FB;
    --ink: #101828;
    --ink-2: #344054;
    --muted: #5B6478;
    --line: #E1E5EC;
    --line-2: #CDD3DE;
    --navy: #16223F;
    --navy-2: #1F2E52;
    --on-navy: #F4F6FB;
    --on-navy-muted: #A9B4CF;
    --yellow: #F5C518;
    --yellow-ink: #3A2E00;
    --good: #1E8E5A;
    --good-bg: #E3F5EB;
    --warn: #C96A00;
    --warn-bg: #FCEFD9;
    --bad: #D93A3A;
    --bad-bg: #FBE4E4;
    --neutral-bg: #EAEDF3;
    --focus: #2F6BFF;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
    --display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --r-sm: 6px;
    --r: 12px;
    --r-lg: 18px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0C1220;
      --surface: #141C2E;
      --surface-2: #1A2338;
      --ink: #EEF2F8;
      --ink-2: #C9D1E0;
      --muted: #97A2B8;
      --line: #27324A;
      --line-2: #37445F;
      --navy: #1A2540;
      --navy-2: #223058;
      --on-navy: #F4F6FB;
      --on-navy-muted: #A9B4CF;
      --good: #34C57A;
      --good-bg: #123526;
      --warn: #F5A623;
      --warn-bg: #3A2A0C;
      --bad: #F0564F;
      --bad-bg: #3F1716;
      --neutral-bg: #1F2A42;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0C1220;
    --surface: #141C2E;
    --surface-2: #1A2338;
    --ink: #EEF2F8;
    --ink-2: #C9D1E0;
    --muted: #97A2B8;
    --line: #27324A;
    --line-2: #37445F;
    --navy: #1A2540;
    --navy-2: #223058;
    --on-navy: #F4F6FB;
    --on-navy-muted: #A9B4CF;
    --good: #34C57A;
    --good-bg: #123526;
    --warn: #F5A623;
    --warn-bg: #3A2A0C;
    --bad: #F0564F;
    --bad-bg: #3F1716;
    --neutral-bg: #1F2A42;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  svg { display: block; }

  /* ---------- Top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy); color: var(--on-navy);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .top-in {
    max-width: 1080px; margin: 0 auto; padding: 10px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 9px;
    background: none; border: 0; padding: 4px 2px; color: inherit;
    font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.01em;
  }
  .wordmark .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 3px rgba(245,197,24,.22); }
  .top form { flex: 1; display: flex; gap: 8px; max-width: 460px; margin-left: auto; }
  .top input {
    flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
    color: var(--on-navy); border-radius: var(--r-sm); padding: 8px 10px; font-family: var(--mono); font-size: 14px;
    text-transform: uppercase;
  }
  .top input::placeholder { color: var(--on-navy-muted); text-transform: none; font-family: var(--body); }
  .top .go { border: 0; background: var(--yellow); color: var(--yellow-ink); font-weight: 600; padding: 8px 14px; border-radius: var(--r-sm); }
  .top .clock { font-family: var(--mono); font-size: 13px; color: var(--on-navy-muted); white-space: nowrap; }
  @media (max-width: 640px) { .top .clock { display: none; } .top form { max-width: none; } }

  /* ---------- Layout ---------- */
  main { max-width: 1080px; margin: 0 auto; padding: 18px 16px 64px; }
  .cols { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 900px) {
    .cols { grid-template-columns: minmax(0, 1fr) 420px; align-items: start; }
    .cols > .right { position: sticky; top: 72px; }
  }
  @media (max-width: 899px) { .cols > .right { order: -1; } }
  .stack { display: flex; flex-direction: column; gap: 18px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 18px;
  }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; letter-spacing: -.015em; }
  h2 { font-size: 20px; font-weight: 700; }
  h3 { font-size: 16px; font-weight: 700; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }

  /* ---------- Pills & chips ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; background: var(--neutral-bg); color: var(--ink-2); white-space: nowrap;
  }
  .pill.good { background: var(--good-bg); color: var(--good); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.live .d { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .pill.live .d { animation: none; } }

  .chip {
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .chip .k { font-family: var(--mono); font-size: 12px; opacity: .8; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm);
    padding: 7px 12px; font-weight: 600; font-size: 13.5px; color: var(--ink);
  }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn:hover { border-color: var(--muted); }
  .btn.primary:hover { background: var(--navy-2); }
  .link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

  /* ---------- Home ---------- */
  .hero {
    background: var(--navy); color: var(--on-navy); border-radius: var(--r-lg);
    padding: 28px 22px 22px;
    display: grid; gap: 16px;
  }
  .hero h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; line-height: 1.02; max-width: 16ch; }
  .hero p { color: var(--on-navy-muted); max-width: 52ch; }
  .hero form { display: grid; grid-template-columns: 1fr auto; gap: 8px; max-width: 520px; }
  .hero input {
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: var(--on-navy);
    border-radius: var(--r); padding: 12px 14px; font-family: var(--mono); font-size: 18px; text-transform: uppercase; min-width: 0;
  }
  .hero input::placeholder { color: var(--on-navy-muted); text-transform: none; font-family: var(--body); font-size: 16px; }
  .hero .go { border: 0; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; padding: 0 18px; border-radius: var(--r); font-size: 15px; }
  .hero .chips .chip { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); color: var(--on-navy); }
  .hero .chips .chip[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }

  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .fl {
    text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
    padding: 12px 14px; display: grid; gap: 8px; color: inherit;
  }
  .fl:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .fl .ident { font-family: var(--mono); font-weight: 600; font-size: 15px; }
  .fl .route { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .fl .when { font-family: var(--mono); font-size: 13px; }
  .fl .l2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  .apgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ap {
    text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
    padding: 12px 14px; display: grid; gap: 4px; color: inherit;
  }
  .ap:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .ap .code { font-family: var(--mono); font-weight: 600; font-size: 17px; }
  .ap .name { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap .w { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; margin-top: 4px; }
  .ap .w small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 4px; }

  /* ---------- Flight header ---------- */
  .fhead { display: grid; gap: 14px; }
  .fhead .l1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fhead .ident { font-family: var(--mono); font-weight: 600; font-size: 20px; }
  .fhead .airline { color: var(--muted); }
  .route-big { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .route-big .code { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7vw, 48px); line-height: 1; letter-spacing: -.02em; }
  .route-big .city { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .route-big .t { font-family: var(--mono); font-size: 15px; margin-top: 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .route-big .t s { color: var(--muted); text-decoration: line-through; }
  .route-big .t .delta { color: var(--bad); font-weight: 600; font-size: 13px; }
  .route-big .to { text-align: right; }
  .route-big .plane { color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .fact .k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .fact .v { font-family: var(--mono); font-size: 16px; font-weight: 500; margin-top: 2px; }
  .fact .v.changed { color: var(--warn); }

  /* ---------- Verdict ---------- */
  .verdict {
    background: var(--navy); color: var(--on-navy); border-radius: var(--r-lg);
    padding: 20px 20px 18px; display: grid; gap: 14px; position: relative; overflow: hidden;
  }
  .verdict::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--vc, var(--good));
  }
  .verdict .eyebrow { color: var(--on-navy-muted); }
  .verdict .big { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 9vw, 58px); line-height: .98; letter-spacing: -.025em; }
  .verdict .big .ampm { font-size: .42em; font-weight: 700; margin-left: 6px; letter-spacing: 0; }
  .verdict .sub { color: var(--on-navy-muted); font-size: 14.5px; max-width: 46ch; }
  .verdict .sub b { color: var(--on-navy); font-weight: 600; }
  .verdict .state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .verdict .pill { background: rgba(255,255,255,.1); color: var(--on-navy); }
  .verdict .pill.good { color: #7EE2AE; }
  .verdict .pill.warn { color: #FFC862; }
  .verdict .pill.bad { color: #FF8B85; }
  .verdict .in { font-family: var(--mono); font-size: 13px; color: var(--on-navy-muted); }

  /* bridge bar */
  .bridge { display: grid; gap: 6px; }
  .bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.06); position: relative; }
  .seg { min-width: 3px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--on-navy); overflow: hidden; white-space: nowrap; border-right: 1px solid rgba(0,0,0,.25); }
  .seg.travel { background: #3E5289; }
  .seg.curb { background: #4A6199; }
  .seg.bag { background: #55659B; }
  .seg.wait { background: #7D6B2C; }
  .seg.walk { background: #4A6199; }
  .seg.buffer { background: rgba(255,255,255,.12); }
  .seg.boarding { background: #2F7A57; }
  .seg.close { background: #8A3E3E; }
  .seg span { padding: 0 6px; }
  .nowmark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--yellow); box-shadow: 0 0 0 2px rgba(245,197,24,.25); }
  .nowmark::after { content: "now"; position: absolute; top: -16px; left: -12px; font-family: var(--mono); font-size: 10px; color: var(--yellow); letter-spacing: .04em; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--on-navy-muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  /* steps */
  .steps { list-style: none; margin: 0; padding: 0; display: grid; }
  .step { display: grid; grid-template-columns: 74px 18px 1fr; gap: 0 10px; align-items: start; position: relative; padding: 0 0 14px; }
  .step:last-child { padding-bottom: 0; }
  .step .t { font-family: var(--mono); font-size: 14px; font-weight: 500; padding-top: 1px; }
  .step .t small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .step .n { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); position: relative; z-index: 1; margin-top: 2px; }
  .step.now .n { background: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(245,197,24,.25); }
  .step.hard .n { background: var(--navy); border-color: var(--navy); }
  .step.past .n { border-color: var(--line); background: var(--line); }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 92px; top: 20px; bottom: -2px; width: 2px; background: var(--line); }
  .step .b { display: grid; gap: 2px; }
  .step .title { font-weight: 600; }
  .step .desc { font-size: 13px; color: var(--muted); }
  .step .desc b { color: var(--ink-2); font-weight: 600; }
  .step .desc .live { color: var(--good); font-weight: 600; }

  /* controls */
  .controls { display: grid; gap: 12px; }
  .ctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ctl .lab { display: grid; gap: 1px; }
  .ctl .lab b { font-weight: 600; font-size: 14px; }
  .ctl .lab span { font-size: 12.5px; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
  .stepper button { width: 34px; height: 34px; border: 0; background: var(--surface-2); font-size: 18px; line-height: 1; }
  .stepper button:hover { background: var(--neutral-bg); }
  .stepper output { min-width: 68px; text-align: center; font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .switch { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line-2); border: 0; padding: 0; flex: none; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch[aria-checked="true"] { background: var(--good); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; }
  .seg-ctl button { border: 0; background: var(--surface-2); padding: 7px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg-ctl button + button { border-left: 1px solid var(--line-2); }
  .seg-ctl button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }

  /* ---------- Security ---------- */
  .cps { display: grid; gap: 8px; }
  .cp {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
    border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface);
    text-align: left; color: inherit; position: relative;
  }
  .cp:hover { border-color: var(--line-2); }
  .cp.rec { border-color: var(--yellow); background: linear-gradient(0deg, rgba(245,197,24,.07), rgba(245,197,24,.07)), var(--surface); }
  .cp.rec::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 4px; border-radius: 0 3px 3px 0; background: var(--yellow); }
  .cp.closed { opacity: .55; }
  .cp .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cp .nm .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--yellow-ink); background: var(--yellow); padding: 1px 6px; border-radius: 4px; }
  .cp .meta { font-size: 12.5px; color: var(--muted); }
  .cp .tot { text-align: right; font-family: var(--mono); }
  .cp .tot b { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: -.02em; }
  .cp .tot small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cp .tot .delta { color: var(--muted); font-size: 12px; }
  .lanes { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .lane { display: grid; gap: 4px; }
  .lane .lk { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .lane .lk b { color: var(--ink); font-weight: 600; }
  .lane .lk .tr { font-size: 11px; }
  .lane .lk .tr.up { color: var(--bad); }
  .lane .lk .tr.down { color: var(--good); }
  .lane .track { height: 6px; border-radius: 3px; background: var(--neutral-bg); overflow: hidden; }
  .lane .fill { height: 100%; border-radius: 3px; background: var(--ink-2); }
  .lane.sel .fill { background: var(--yellow); }
  .lane.sel .lk b { color: var(--ink); }
  .lane.na .lk { opacity: .55; }
  .srcline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .src { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 4px; background: var(--neutral-bg); color: var(--ink-2); }
  .src.live { background: var(--good-bg); color: var(--good); }
  .src.demo { background: var(--warn-bg); color: var(--warn); }

  /* alerts */
  .alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .alert { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: baseline; font-size: 14px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
  .alert .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .alert.warn { background: var(--warn-bg); }

   Simulation (used whenever no live provider answers)
   ============================================================ */
function curveAt(h, profile) {
  const peaks = profile === "leisure" ? [[6, 1.0, 1.4], [11, .6, 2], [16, .7, 2.2]]
    : profile === "intl" ? [[6.5, .6, 1.5], [12, .6, 2], [17.5, 1.0, 2.2], [21, .5, 1.5]]
    : [[6.5, 1.0, 1.3], [11.5, .6, 2], [16.5, .85, 2]];

}
const DOW = [1.1, 1.15, .9, .9, 1.15, 1.1, .85];
function simLaneWait(code, cp, when, lane, withNoise = true) {
  const ap = AIRPORTS[code]; const { hour, dow } = tzParts(when, ap.tz);
  if (hour < cp.hours[0] || hour >= cp.hours[1]) return null;
  let std = ap.base * cp.f * curveAt(hour, ap.profile) * DOW[dow];
  if (withNoise) std *= .75 + .5 * noise(cp.id, when.getTime());
  std = Math.max(2, std);
  if (lane === "pre") return Math.max(2, std * .35 + 1);
  if (lane === "clear") return Math.max(1, std * .22 + 1);
  return std;
}
function simWaits(code, when = new Date()) {
  const ap = AIRPORTS[code];
  return {
    airport: code, updated: Date.now() - Math.round(rand(hash(code + Math.floor(when / (5 * MIN)))) * 4 * MIN), source: "demo",
    granularity: "checkpoint",
    checkpoints: ap.checkpoints.map(cp => {
      const lanes = {}; for (const l of ["std", "pre", "clear"]) {
        if (!cp.lanes.includes(l)) { lanes[l] = null; continue; }
        const now = simLaneWait(code, cp, when, l), prev = simLaneWait(code, cp, new Date(when - 15 * MIN), l);
        lanes[l] = now == null ? null : { min: Math.round(now), trend: prev == null ? 0 : Math.sign(Math.round(now) - Math.round(prev)) };
      }
      return { id: cp.id, open: lanes.std !== null || lanes.pre !== null, lanes };
    }),

}

function simFlight(ident, day) {
  const demo = DEMO.find(d => d.ident === ident);
  const code = ident.slice(0, 2), num = ident.slice(2);
  const al = AIRLINES[code] || { name: code + " Airlines", hubs: ORIGINS };
  const seed = hash(ident);
  const origin = demo ? demo.origin : al.hubs[seed % al.hubs.length];
  const intl = !demo && al.intl && rand(seed + 3) < .25;
  let dest = demo ? demo.dest : (intl ? INTL_POOL[seed % INTL_POOL.length] : DEST_POOL[(seed >> 3) % DEST_POOL.length]);
  if (dest === origin) dest = "DEN";
  const ap = AIRPORTS[origin];
  // Anchor scheduled time to a clock minute so it reads like a real schedule.
  const base = demo ? demo.offset : 45 + Math.floor(rand(seed + 1) * 330);
  const sched = new Date(Math.round((Date.now() + base * MIN) / (5 * MIN)) * 5 * MIN + (day === "tomorrow" ? 24 * 60 * MIN : 0));
  // Delay: fixed per flight with slow drift so alerts occur naturally.
  let delay = demo ? demo.delay : (rand(seed + 2) < .3 ? 10 + Math.floor(rand(seed + 4) * 50) : 0);
  if (delay) delay += Math.round(noise(ident + ":drift", Date.now(), 20) * 10 - 5);
  const est = new Date(sched.getTime() + Math.max(0, delay) * MIN);
  const cps = ap.checkpoints; const cpSeed = cps[seed % cps.length];
  let gate = demo ? demo.gate : null;
  if (!gate) {
    const cons = Object.keys(cpSeed.walk); const con = cons[(seed >> 5) % cons.length];
    gate = ap.numeric ? String((ap.numeric.find(r => r[2] === con) || [1])[0] + 1 + (seed % 8)) : con + (1 + (seed % 30));
  }
  // Gate change event: some flights swap gate 90 min before departure.
  let gateChanged = false;
  if (!demo && rand(seed + 7) < .2 && est - Date.now() < 90 * MIN) { const m = gate.match(/^([A-Z]*)(\d+)$/); if (m) { gate = m[1] + (+m[2] + 4); gateChanged = true; } }
  const cp = cps.find(c => c.walk[gateConcourse(origin, gate)]) || cps[0];
  const toDep = est - Date.now();
  const isIntl = !!AIRPORTS[dest] && !["America", "Pacific/Honolulu"].some(p => AIRPORTS[dest].tz.startsWith(p));
  const boardingLead = al.boarding || (isIntl ? 60 : 40);
  let status = "Scheduled";
  if (toDep < -5 * MIN) status = "Departed";
  else if (toDep < 15 * MIN) status = "Final call";
  else if (toDep < boardingLead * MIN) status = "Boarding";
  else if (delay > 0) status = "Delayed";
  else status = "On time";
  return {
    ident, airline: { code, name: al.name }, number: num, status, source: "demo", international: isIntl,
    boardingLead, doorClose: isIntl ? 20 : 15, bagCutoff: isIntl ? 60 : 45,
    departure: { airport: origin, terminal: cp.terminal, gate, scheduled: sched.toISOString(), estimated: est.toISOString(), delay: Math.max(0, delay), gateChanged },
    arrival: { airport: dest, scheduled: new Date(sched.getTime() + (isIntl ? 620 : 150 + (seed % 200)) * MIN).toISOString() },
    aircraft: ["Boeing 737-900", "Airbus A321neo", "Boeing 787-9", "Airbus A320", "Boeing 737 MAX 8", "Embraer 175"][seed % 6],
    fetched: Date.now(),

}

/* ============================================================
   Data access: live API when served by server.mjs, demo otherwise
   ============================================================ */
const live = { flight: null, waits: null };
async function api(path) {
  if (location.protocol !== "http:" && location.protocol !== "https:") throw new Error("offline");
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
  try { const r = await fetch(path, { signal: ctl.signal, headers: { accept: "application/json" } }); if (!r.ok) throw new Error(String(r.status)); return await r.json(); }
  finally { clearTimeout(t); }
}
async function getFlight(ident, day) {
  const sim = simFlight(ident, day);
  try {
    const date = dateStr(new Date(Date.now() + (day === "tomorrow" ? 864e5 : 0)), AIRPORTS[sim.departure.airport].tz);
    const f = await api(`/api/flight?ident=${encodeURIComponent(ident)}&date=${date}`);
    if (f && f.departure && f.departure.airport) { live.flight = f.source; f.fetched = Date.now(); return normalizeFlight(f); }
  } catch {}
  live.flight = null; return sim;
}
function normalizeFlight(f) {
  const code = f.departure.airport; const ap = AIRPORTS[code];
  const dest = f.arrival && f.arrival.airport; const isIntl = !!(dest && AIRPORTS[dest] && !AIRPORTS[dest].tz.startsWith("America") && AIRPORTS[dest].tz !== "Pacific/Honolulu") || !!f.international;
  const al = AIRLINES[f.ident.slice(0, 2)] || {};
  return Object.assign({ boardingLead: al.boarding || (isIntl ? 60 : 40), doorClose: isIntl ? 20 : 15, bagCutoff: isIntl ? 60 : 45, international: isIntl }, f,
    { departure: Object.assign({ delay: Math.max(0, Math.round((new Date(f.departure.estimated || f.departure.scheduled) - new Date(f.departure.scheduled)) / MIN)) }, f.departure) });
}
async function getWaits(code) {
  const sim = simWaits(code);
  try {
    const w = await api(`/api/waits/${code}`);
    if (w && w.checkpoints) { live.waits = w.source; return mergeWaits(code, w, sim); }
  } catch {}

}
/* Live feeds rarely name every checkpoint the way the airport does; match
   by normalized name, and fall back to an airport-wide number when that is
   all the provider gives. */
function mergeWaits(code, w, sim) {
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const out = { airport: code, updated: w.updated || Date.now(), source: w.source || "live", granularity: w.granularity || "checkpoint", checkpoints: [] };
  for (const s of sim.checkpoints) {
    const cp = AIRPORTS[code].checkpoints.find(c => c.id === s.id);
    const m = w.checkpoints.find(x => x.id === s.id || (x.name && (norm(x.name) === norm(cp.name) || norm(cp.name).includes(norm(x.name)) || norm(x.name).includes(norm(cp.name.split("·")[0]))))) || (w.granularity === "airport" ? w.checkpoints[0] : null);
    if (!m) { out.checkpoints.push(Object.assign({}, s, { estimated: true })); continue; }
    const lanes = {};
    for (const l of ["std", "pre", "clear"]) { const v = m.lanes && m.lanes[l]; lanes[l] = !cp.lanes.includes(l) ? null : v == null ? (s.lanes[l] ? Object.assign({}, s.lanes[l], { estimated: true }) : null) : { min: Math.round(v.min), trend: v.trend || 0 }; }
    out.checkpoints.push({ id: s.id, open: m.open !== false, lanes });

/* ============================================================
   The bridge: turn a flight + live waits + your prefs into a plan
   ============================================================ */
const CURB = 8, BAGDROP = 12;
function computePlan(flight, waits, p, forcedCp) {
  const code = flight.departure.airport; const ap = AIRPORTS[code];

  const con = gateConcourse(code, flight.departure.gate);
  const lane = p.lane;
  const now = Date.now();
  const options = ap.checkpoints.map(cp => {
    const w = waits.checkpoints.find(x => x.id === cp.id) || { open: false, lanes: {} };
    const laneUsed = lane === "clear" ? (cp.lanes.includes("clear") ? "clear" : cp.lanes.includes("pre") ? "pre" : "std") : lane === "pre" ? (cp.lanes.includes("pre") ? "pre" : "std") : "std";

    const sameTerminal = con ? cp.walk[con] != null : cp.terminal === flight.departure.terminal;

    // "leaving now" and "leaving just in time", using the current wait as a first guess.
    const arrive = new Date(Math.max(now + (p.travel + CURB + (p.bag ? BAGDROP : 0)) * MIN, boarding - (p.buffer + walk + (nowWait == null ? 15 : nowWait)) * MIN));

      else if (arrive - now > 45 * MIN) wait = null; // closed when you would get there
    }

  else if (slackMin >= 20) { state = "good"; headline = "On track"; detail = `Leave in ${fmtDur(slackMin)} and you'll be at the gate ${p.buffer} min before boarding.`; }
  else if (slackMin >= 0) { state = "warn"; headline = "Tight"; detail = `Only ${fmtDur(slackMin)} until you need to leave. Get ready now.`; }
  else if (gateIfNow <= doorClose - 2 * MIN) { state = "warn"; headline = "Leave now"; detail = `Leaving this minute, you reach ${flight.departure.gate ? "gate " + flight.departure.gate : "the gate"} ${fmtDur((doorClose - gateIfNow) / MIN)} before the door closes. No buffer left.`; }

  t += p.travel * MIN; push("Arrive at the curb", t, `${CURB} min to reach the checkpoint`, "curb");

  t += wait * MIN; push("Through security", t, `${walk} min walk to ${flight.departure.gate ? "gate " + flight.departure.gate : "the gate"}`, "walk");

const ICON = {

function navigate(hash) { if (location.hash !== hash) location.hash = hash; else route(); }

/* ---------- Home ---------- */

}
function flightCard(f) {

function goSearch(q) {
  const ident = parseIdent(q);
  if (!ident) { toast("Enter an airline code and number, like UA 1523."); return; }
  navigate(`#/flight/${ident}/${prefs.day}`);
}

/* ---------- Flight ---------- */
async function openFlight(ident, day) {
  state.forcedCp = null; state.alerts = []; state.snapshot = null; state.loading = true;
  view.innerHTML = `<div class="card"><div class="row"><span class="pill live"><span class="d"></span>Checking</span><span class="muted">${ident.slice(0, 2)} ${ident.slice(2)} · flight status and checkpoint waits</span></div></div>`;
  await refreshFlight(ident, day, true);
  state.loading = false;
  state.timer = setInterval(() => refreshFlight(ident, day, false), 30000);
}
async function refreshFlight(ident, day, first) {
  const flight = await getFlight(ident, day);
  const waits = await getWaits(flight.departure.airport);
  if (state.route !== location.hash) return;
  state.flight = flight; state.waits = waits;
  const plan = computePlan(flight, waits, prefs, state.forcedCp);
  if (!first) diffSnapshot(plan);
  state.plan = plan; state.snapshot = snap(plan);
  if (first) { recents = [{ ident, at: Date.now() }, ...recents.filter(r => r.ident !== ident)].slice(0, 8); store.set("recents", recents); }
  renderFlight();
}
function snap(p) { return { est: p.dep.getTime(), gate: state.flight.departure.gate, rec: p.rec.cp.id, wait: p.wait, state: p.state, leave: p.leaveBy.getTime() }; }

function srcBadge(src) {

}
function cpRow(o, p) {

      <div class="lk"><span>${laneShort(l)}</span><span>${v ? `<b>${v.min}</b> ${v.trend > 0 ? '<span class="tr up">▲</span>' : v.trend < 0 ? '<span class="tr down">▼</span>' : ""}` : (o.cp.lanes.includes(l) ? "closed" : "n/a")}</span></div>
      <div class="track"><div class="fill" style="width:${v ? clamp(v.min / max * 100, 4, 100) : 0}%"></div></div></div>`; }).join("")}</div>
  </button>`;
}
function stepRow(s, i, p, tz) {
  const now = Date.now(); const t = s.at.getTime();
  const next = p.steps[i + 1]; const isNow = t <= now && (!next || next.at.getTime() > now);

    <div class="t">${fmtTime(s.at, tz)}<small>${s.kind === "hard" ? "fixed" : fmtRel(t - now)}</small></div>
    <div class="n"></div>

/* ---------- Airport ---------- */
async function openAirport(code) {
  state.apCode = code; state.apLane = prefs.lane;
  state.waits = await getWaits(code);
  if (state.route !== location.hash) return;
  const open = state.waits.checkpoints.filter(c => c.open);
  state.apCp = state.apCp && open.some(c => c.id === state.apCp) ? state.apCp : (open[0] || state.waits.checkpoints[0]).id;
  renderAirport();
  state.timer = setInterval(async () => { state.waits = await getWaits(code); if (state.route === location.hash) renderAirport(); }, 30000);
}
function renderAirport() {
  const code = state.apCode, ap = AIRPORTS[code], tz = ap.tz, w = state.waits, lane = state.apLane;
  const cp = ap.checkpoints.find(c => c.id === state.apCp);
  const cur = w.checkpoints.find(c => c.id === cp.id);
  const laneUsed = cur.lanes[lane] ? lane : cur.lanes.std ? "std" : null;
  const now = new Date(); const { hour, abbr } = tzParts(now, tz);
  // Typical curve for today at 15-min resolution, in airport local time
  const pts = []; for (let h = 0; h <= 24; h += .25) { const when = new Date(now.getTime() + (h - hour) * 3600000); const v = simLaneWait(code, cp, when, laneUsed || "std", false); pts.push({ h, v: v == null ? null : v }); }
  const maxV = Math.max(10, ...pts.map(q => q.v || 0)) * 1.15;
  const W = 640, H = 220, L = 34, R = 12, T = 18, B = 30;
  const x = h => L + (h / 24) * (W - L - R), y = v => T + (1 - v / maxV) * (H - T - B);
  let path = "", area = "", open = false;
  pts.forEach(q => { if (q.v == null) { open = false; return; } const c = `${x(q.h).toFixed(1)} ${y(q.v).toFixed(1)}`; if (!open) { if (area) area += ` L ${x(pts[pts.indexOf(q) - 1] ? pts[pts.indexOf(q) - 1].h : q.h).toFixed(1)} ${y(0)} Z`; path += ` M ${c}`; area += ` M ${x(q.h).toFixed(1)} ${y(0)} L ${c}`; open = true; } else { path += ` L ${c}`; area += ` L ${c}`; } });
  if (open) area += ` L ${x(pts[pts.length - 1].h).toFixed(1)} ${y(0)} Z`;
  // Best window in the next 6 hours: lowest 60-minute average
  let best = null; for (let i = 0; i < pts.length - 4; i++) { const seg = pts.slice(i, i + 4); if (seg[0].h < hour || seg[0].h > hour + 6 || seg.some(q => q.v == null)) continue; const avg = seg.reduce((a, q) => a + q.v, 0) / 4; if (!best || avg < best.avg) best = { h: seg[0].h, avg }; }
  const fmtH = h => fmtTime(new Date(now.getTime() + (h - hour) * 3600000), tz);
  const liveV = laneUsed && cur.lanes[laneUsed] ? cur.lanes[laneUsed].min : null;
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24];
  const yt = []; for (let v = 0; v < maxV; v += maxV > 60 ? 20 : maxV > 30 ? 10 : 5) yt.push(Math.round(v));
  const busiest = pts.filter(q => q.v != null).reduce((a, q) => (!a || q.v > a.v ? q : a), null);
  view.innerHTML = `
    <div class="stack">
      <section class="aphead">
        <div class="eyebrow">${esc(ap.name)}</div>
        <h1>${code} security now</h1>
        <p class="muted">${w.checkpoints.filter(c => c.open).length} of ${ap.checkpoints.length} checkpoints open · ${fmtTime(now, tz)} ${abbr} · updated ${ago(w.updated)} ${srcBadge(w.source)}</p>
      </section>
      <div class="cols">
        <section class="card">
          <div class="card-h"><h2>All checkpoints</h2><div class="seg-ctl" role="group" aria-label="Lane">${["std", "pre", "clear"].map(l => `<button data-aplane="${l}" aria-pressed="${lane === l}">${laneShort(l)}</button>`).join("")}</div></div>
          <div class="cps">${ap.checkpoints.map(c => { const cw = w.checkpoints.find(x => x.id === c.id); const v = cw.lanes[lane]; const sel = c.id === state.apCp; return `
            <button class="cp ${sel ? "rec" : ""} ${cw.open ? "" : "closed"}" data-apcp="${c.id}" aria-pressed="${sel}">
              <div><div class="nm">${esc(c.name)}</div><div class="meta">${cw.open ? `Open until ${c.hours[1] >= 24 ? "midnight" : fmtH(c.hours[1])} · ${c.lanes.map(laneShort).join(", ")}` : `Opens ${fmtH(c.hours[0])}`}</div></div>
              <div class="tot">${cw.open ? (v ? `<b>${v.min}</b><small>min ${laneShort(lane)} ${v.trend > 0 ? "▲ rising" : v.trend < 0 ? "▼ falling" : "steady"}</small>` : `<b>—</b><small>no ${laneShort(lane)} lane</small>`) : `<b>—</b>`}</div>
            </button>`; }).join("")}</div>
        </section>
        <div class="right stack">
          <section class="card">
            <div class="card-h"><h2>${esc(cp.name.split(" · ").pop())}</h2><span class="small muted">${laneShort(laneUsed || lane)} lane · today</span></div>
            <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Typical wait through the day with the live reading">
              ${yt.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join("")}
              ${best ? `<rect class="band" x="${x(best.h)}" y="${T}" width="${x(best.h + 1) - x(best.h)}" height="${H - T - B}"/>` : ""}
              <path class="area" d="${area}"/><path class="curve" d="${path}"/>
              <line class="nowline" x1="${x(hour).toFixed(1)}" x2="${x(hour).toFixed(1)}" y1="${T}" y2="${H - B}"/>
              ${liveV != null ? `<circle class="livept" cx="${x(hour).toFixed(1)}" cy="${y(liveV).toFixed(1)}" r="5"/>` : ""}
              ${ticks.map(h => `<text x="${x(h).toFixed(1)}" y="${H - 10}" text-anchor="middle">${h === 24 ? "12a" : h === 0 ? "12a" : h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a"}</text>`).join("")}
            </svg>
            <div class="kv" style="margin-top:12px">
              <div class="tile"><div class="k">Right now</div><div class="v">${liveV == null ? "—" : liveV + " <small>min</small>"}</div></div>
              <div class="tile"><div class="k">Typical at this hour</div><div class="v">${(() => { const v = simLaneWait(code, cp, now, laneUsed || "std", false); return v == null ? "—" : Math.round(v) + " <small>min</small>"; })()}</div></div>
              <div class="tile"><div class="k">Calmest next 6 h</div><div class="v">${best ? `${fmtH(best.h)} <small>~${Math.round(best.avg)} min</small>` : "—"}</div></div>
              <div class="tile"><div class="k">Busiest today</div><div class="v">${busiest ? `${fmtH(busiest.h)} <small>~${Math.round(busiest.v)} min</small>` : "—"}</div></div>
            </div>
            <p class="small muted" style="margin-top:10px">Curve is the typical pattern for a ${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][tzParts(now, tz).dow]}; the yellow point is the current reading. The green band is the calmest hour coming up.</p>
          </section>
          <section class="card"><div class="card-h"><h2>Flying from ${code}?</h2></div>
            <form id="apsearch" style="display:flex;gap:8px"><label class="sr" for="apq">Flight number</label><input id="apq" class="mono" placeholder="Flight number" style="flex:1;min-width:0;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--surface);text-transform:uppercase"><button class="btn primary" type="submit">Plan my leave-by</button></form>
          </section>
        </div>
      </div>
    </div>`;
  $("#apsearch").addEventListener("submit", e => { e.preventDefault(); goSearch($("#apq").value); });
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]"); if (nav) { navigate(nav.dataset.nav); return; }
  const day = e.target.closest("[data-day]"); if (day) { prefs.day = day.dataset.day; savePrefs(); renderHome(); return; }
  const lane = e.target.closest("[data-lane]");
  if (lane) { const l = lane.dataset.lane; prefs.lane = prefs.lane === l && lane.classList.contains("chip") ? "std" : l; savePrefs(); replan(); if (state.route === "#/" || state.route === "") renderHome(); return; }
  const tr = e.target.closest("[data-travel]"); if (tr) { prefs.travel = clamp(prefs.travel + +tr.dataset.travel, 5, 180); savePrefs(); replan(); return; }
  const bf = e.target.closest("[data-buffer]"); if (bf) { prefs.buffer = clamp(prefs.buffer + +bf.dataset.buffer, 0, 60); savePrefs(); replan(); return; }
  const bag = e.target.closest("[data-bag]"); if (bag) { prefs.bag = !prefs.bag; savePrefs(); replan(); return; }
  const cp = e.target.closest("[data-cp]"); if (cp) { state.forcedCp = state.forcedCp === cp.dataset.cp ? null : cp.dataset.cp; replan(); return; }
  const apcp = e.target.closest("[data-apcp]"); if (apcp) { state.apCp = apcp.dataset.apcp; renderAirport(); return; }
  const apl = e.target.closest("[data-aplane]"); if (apl) { state.apLane = apl.dataset.aplane; renderAirport(); return; }
});
function replan() { if (state.flight && state.waits && /^#\/flight\//.test(state.route)) { state.plan = computePlan(state.flight, state.waits, prefs, state.forcedCp); state.snapshot = snap(state.plan); renderFlight(); } }
$("#topsearch").addEventListener("submit", e => { e.preventDefault(); goSearch($("#q").value); $("#q").value = ""; });

let toastT; function toast(msg) { let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); } el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200); }
function tickClock() { const el = $("#clock"); if (el) el.textContent = new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" }).format(new Date()); }
setInterval(tickClock, 1000); tickClock();
// Keep relative labels ("in 12 min", "updated 40s ago") honest without a data refresh.
setInterval(() => { if (/^#\/flight\//.test(state.route) && state.plan && !state.loading) { state.plan = computePlan(state.flight, state.waits, prefs, state.forcedCp); renderFlight(); } }, 60000);

route();
})();
