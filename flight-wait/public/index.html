<title>Leaveby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">

<header class="top">
  <div class="top-in">
    <button class="wordmark" data-nav="#/" aria-label="Leaveby home"><span class="dot"></span>Leaveby</button>
    <span class="clock" id="clock"></span>
    <form id="topsearch" role="search">
      <label class="sr" for="q">Flight number</label>
      <input id="q" name="q" placeholder="Flight number, e.g. UA 1523" autocomplete="off" spellcheck="false">
      <button class="go" type="submit">Check</button>
    </form>
  </div>
</header>
<main id="view" aria-live="polite"></main>

<script src="core.js"></script>
<script src="app.js"></script>
